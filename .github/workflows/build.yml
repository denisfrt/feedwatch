name: Tauri/react/node CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        include:
          - os: ubuntu-latest
            artifact: appimage/feedwatch_0.1.0_amd64.AppImage
            target: build:linux

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Build app
        run: pnpm run ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          path: tauri/src-tauri/target/release/bundle/${{ matrix.artifact }}
          archive: false

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            tauri/src-tauri/target/release/bundle/${{ matrix.artifact }}
