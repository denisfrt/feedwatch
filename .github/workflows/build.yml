name: Tauri/react/node CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        include:
          - os: ubuntu-latest
            artifact: appimage/feedwatch_0.1.0_amd64.AppImage
            target: build:linux

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo cp tauri/bin/xdg-open /usr/bin/xdg-open
          sudo chmod +x /usr/bin/xdg-open
          /usr/bin/xdg-open --version