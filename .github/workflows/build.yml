name: Python CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        include:
          - os: windows-latest
            target: build:windows

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Build app
        run: pnpm run ${{ matrix.target }}
